---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  workflows:
    uses: homeassistant-apps/workflows/.github/workflows/addon-ci.yaml@535edddae02f364087408740cee547a8f4b8ed87 # main
