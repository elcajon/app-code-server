---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  workflows:
    uses: homeassistant-apps/workflows/.github/workflows/addon-ci.yaml@d143c6df1da11163007785f9447f793368f80565 # main
