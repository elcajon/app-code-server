---
# yamllint disable rule:line-length
name: Report an issue with Home Assistant App Code-Server
description: Report an issue with Home Assistant App Code-Server.
body:
  - type: markdown
    attributes:
      value: 'This issue form is for reporting bugs only!'
  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem
      description: >-
        Describe the issue you are experiencing here, to communicate to the
        maintainers. Tell us what you were trying to do and what happened.
        Provide a clear and concise description of what the problem is.
  - type: markdown
    attributes:
      value: '## Environment'
  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: What version of Code Server has the issue?
      placeholder: 9.x.x
      description: >-
        Can be found in:
        [Settings -> Add-Ons -> Code-Server](https://my.home-assistant.io/redirect/supervisor_addon/?addon=a03729f7_code-server).
  - type: input
    attributes:
      label: What was the last working version of Code Server?
      placeholder: 9.x.x
      description: >
        If known, otherwise leave blank.
  - type: dropdown
    validations:
      required: true
    attributes:
      label: What type of installation are you running?
      description: >
        Can be found in: [Settings -> System -> System Health](https://my.home-assistant.io/redirect/system_health/).
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Other
  - type: markdown
    attributes:
      value: "# Details"
  - type: textarea
    attributes:
      label: App YAML Configuration
      description: |
        Please provide your whole app configuration as YAML, you can hide any sensitive information.
      render: yaml
  - type: textarea
    attributes:
      label: Anything in the logs that might be useful for us?
      description: Copy and paste the complete log.
      render: txt
  - type: textarea
    validations:
      required: true
    attributes:
      label: Steps to reproduce the issue
      description: |
        Please tell us exactly how to reproduce your issue.
        Provide clear and concise step by step instructions and add code snippets if needed.
        value: | 1. 2. 3.
        ...
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.
